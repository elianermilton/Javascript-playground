<!DOCTYPE html>
<html lang="en">

  <!-- ==================== INTRODUCTION ==================== -->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="elianesstyle.css">
    <title>the atelier of quiet code</title>
  </head>

  <body>
    <!-- ========== soft intro typewriter text ========== -->
    <p id="intro"></p>
    <p id="subintro"></p>

    <!-- ========== main atelier title ========== -->
    <h1 id="title">
      <span id="title-main" class="title-main"></span><br>
      <span id="title-whisper" class="title-whisper"></span>
    </h1>

    <p id="subtitle">
      select a mode to enter.
    </p>

    <!-- =================== MODE BUTTONS =================== -->
    <div id="mode-buttons">
      <div class="mode-card">
        <button id="soft-mode">Soft Mode</button>
        <p class="mode-caption">candlelit, pink, low-pressure coding</p>
      </div>

      <div class="mode-card">
        <button id="focus-mode">Focus Mode</button>
        <p class="mode-caption">quiet tunnel vision, gentle discipline</p>
      </div>
    </div>

    <!-- =================== SCRIPTS =================== -->
    <script src="atelier-intro.js"></script>
    <script src="modes.js"></script>
  </body>

  <!-- =================== ATELIER HEADER =================== -->

<div id="atelier-header">
  <p class="welcome-line">Welcome to</p>
  <h1 class="atelier-name">Éliane’s Atelier</h1>
</div>

</html>
